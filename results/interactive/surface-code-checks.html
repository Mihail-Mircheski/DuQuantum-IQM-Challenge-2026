<div id="surface-code-checks">
  <h3>One X error between ideal rounds</h3>
  <div class="viz-row text-small" aria-label="Legend">
    <span>Buttons: data qubits</span>
    <span class="sc-x-key">X checks</span>
    <span class="sc-z-key">Z checks</span>
  </div>
  <div class="sc-board" role="group" aria-label="Distance-three rotated surface code. Select a data qubit to apply one X error; select it again to remove the error.">
    <svg class="sc-faces" aria-hidden="true"></svg>
    <div class="sc-nodes"></div>
  </div>
  <output class="sc-detail" aria-live="polite"></output>
</div>
<style>
  #surface-code-checks .sc-board { position:relative; width:100%; max-width:470px; aspect-ratio:1; margin-inline:auto; }
  #surface-code-checks .sc-faces { position:absolute; inset:0; width:100%; height:100%; }
  #surface-code-checks .sc-nodes { position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:repeat(7,minmax(0,1fr)); }
  #surface-code-checks .sc-node { display:flex; align-items:center; justify-content:center; min-width:0; }
  #surface-code-checks .sc-check { display:flex; flex-direction:column; align-items:center; color:var(--foreground); font-weight:500; }
  #surface-code-checks .sc-x-key { text-decoration:underline; text-decoration-color:var(--viz-series-1); text-decoration-thickness:3px; text-underline-offset:4px; }
  #surface-code-checks .sc-z-key { text-decoration:underline; text-decoration-color:var(--viz-series-2); text-decoration-thickness:3px; text-underline-offset:4px; }
  #surface-code-checks .sc-detail { display:block; text-align:center; color:var(--foreground); }
</style>
<script>
(() => {
  const root=document.getElementById('surface-code-checks');
  const board=root.querySelector('.sc-board');
  const nodes=root.querySelector('.sc-nodes');
  const svg=root.querySelector('.sc-faces');
  const detail=root.querySelector('.sc-detail');
  const sub=['₀','₁','₂','₃','₄','₅','₆','₇','₈'];
  const checks=[
    {name:'X0',label:'X₀',type:'X',at:[3,3],q:[0,1,3,4],poly:[[2,2],[4,2],[4,4],[2,4]]},
    {name:'X1',label:'X₁',type:'X',at:[5,5],q:[4,5,7,8],poly:[[4,4],[6,4],[6,6],[4,6]]},
    {name:'X2',label:'X₂',type:'X',at:[5,1],q:[1,2],poly:[[4,2],[6,2],[5,.55]]},
    {name:'X3',label:'X₃',type:'X',at:[3,7],q:[6,7],poly:[[2,6],[4,6],[3,7.45]]},
    {name:'Z0',label:'Z₀',type:'Z',at:[1,3],q:[0,3],poly:[[2,2],[2,4],[.55,3]]},
    {name:'Z1',label:'Z₁',type:'Z',at:[5,3],q:[1,2,4,5],poly:[[4,2],[6,2],[6,4],[4,4]]},
    {name:'Z2',label:'Z₂',type:'Z',at:[3,5],q:[3,4,6,7],poly:[[2,4],[4,4],[4,6],[2,6]]},
    {name:'Z3',label:'Z₃',type:'Z',at:[7,5],q:[5,8],poly:[[6,4],[6,6],[7.45,5]]}
  ];
  const readState=state => {
    const value=state?.modelContent?.errorQubit;
    return value===null ? null : Number.isInteger(value)&&value>=0&&value<9 ? value : 4;
  };
  let selected=readState(window.openai?.widgetState);
  const dataButtons=[];
  function cell(col,row) {
    const div=document.createElement('div');
    div.className='sc-node';
    div.style.gridColumn=String(col);
    div.style.gridRow=String(row);
    nodes.append(div);
    return div;
  }
  for(let q=0;q<9;q++) {
    const button=document.createElement('button');
    button.type='button'; button.className='btn'; button.textContent='q'+sub[q];
    button.addEventListener('click',()=>{
      selected=selected===q ? null : q;
      update();
      window.openai?.setWidgetState({modelContent:{errorQubit:selected},privateContent:null}).catch(()=>{});
    });
    cell(2+2*(q%3),2+2*Math.floor(q/3)).append(button);
    dataButtons.push(button);
  }
  checks.forEach(c=>{
    const label=document.createElement('span');
    label.className='sc-check';
    const name=document.createElement('span'); name.textContent=c.label;
    const sign=document.createElement('span'); sign.className='text-small';
    label.append(name,sign);
    cell(c.at[0],c.at[1]).append(label);
    c.sign=sign; c.labelElement=label;
  });
  function update() {
    dataButtons.forEach((b,q)=>{
      b.setAttribute('aria-pressed',String(q===selected));
      b.setAttribute('aria-label','Data qubit '+q+(q===selected?', X error applied. Select to remove.':'. Select to apply one X error.'));
    });
    const changed=[];
    checks.forEach(c=>{
      const flipped=c.type==='Z'&&c.q.includes(selected);
      c.sign.textContent=flipped?'−1':'+1';
      if(flipped) changed.push(c.label);
      c.labelElement.setAttribute('aria-label',c.name+', support '+c.q.map(q=>'q'+q).join(', ')+', eigenvalue '+(flipped?'minus one':'plus one'));
    });
    const logical=[3,4,5].includes(selected)?1:0;
    detail.textContent='Error: '+(selected===null?'none':'X'+sub[selected])+' · Changed checks: '+(changed.join(', ')||'none')+' · Raw logical bit: '+logical;
  }
  function draw() {
    const w=board.clientWidth;
    svg.setAttribute('viewBox','0 0 '+w+' '+w);
    svg.replaceChildren();
    checks.forEach(c=>{
      const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly.setAttribute('points',c.poly.map(([x,y])=>[(x-.5)*w/7,(y-.5)*w/7].join(',')).join(' '));
      poly.setAttribute('fill','color-mix(in srgb, var(--viz-series-'+(c.type==='X'?1:2)+') 15%, transparent)');
      poly.setAttribute('stroke','var(--border)');
      poly.setAttribute('stroke-width','1');
      svg.append(poly);
    });
  }
  window.addEventListener('openai:set_globals',event=>{
    const state=event.detail?.globals?.widgetState;
    if(state!==undefined){selected=readState(state);update();}
  });
  update(); draw();
  new ResizeObserver(draw).observe(board);
})();
</script>
